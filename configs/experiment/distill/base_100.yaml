# @package _global_

# Source of truth:
defaults:
  - distill/base_full
  - _self_

# Experiment Metadata
experiment_name: vital_distill
run_name: base_100

# Evaluation & Testing configuration
data:
  distill: True
  batch_size: 64
  dataset_root: ./datasets/vital_30k

model:
  distill: True
  distill_weight: 100.0
  compile: false
  num_params: 597 # Vital's parameter count

# Trainer configuration
trainer:
  min_steps: 10000
  max_steps: 10000
  val_check_interval: 1000

# Callbacks configuration
callbacks:
  model_checkpoint:
    monitor: val/loss
    mode: min
