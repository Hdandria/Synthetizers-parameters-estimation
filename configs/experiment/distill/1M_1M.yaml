# @package _global_

# Source of truth:
defaults:
  - distill/base_full
  - _self_

# Experiment Metadata
experiment_name: vital_distill
run_name: 1M_1M_v2

# Evaluation & Testing configuration
data:
  distill: True
  batch_size: 128
  dataset_root: ./datasets/vital_1M

model:
  distill: True
  distill_weight: 1.0 # Scaled by normalization now
  distill_lambda_start: 0.9 # Replicating 14:1 distill-heavy start from previous run
  distill_lambda_end: 0.1
  distill_decay_steps: 600000
  distill_ema_momentum: 0.999
  compile: false
  num_params: 597 # Vital's parameter count

# Trainer configuration
trainer:
  min_steps: 1000000
  max_steps: 1000000
  val_check_interval: 5000

# Callbacks configuration
callbacks:
  model_checkpoint:
    monitor: val/loss
    mode: min
