# @package _global_

defaults:
  - vital/base_full
  - _self_

# Experiment metadata
experiment_name: vital
run_name: vital_30k_eval

# Data configuration
data:
  dataset_root: ./datasets/vital_30k

# Trainer configuration
trainer:
  min_steps: 40000
  max_steps: 40000
  val_check_interval: 1000

# Callbacks configuration
callbacks:
  model_checkpoint:
    monitor: val/loss
    mode: min

model:
  num_params: 597 # Vital's parameter count
