# @package _global_

defaults:
  - vital/base_full
  - _self_

# Experiment metadata
experiment_name: vital
run_name: vital_1M_800k

# Data configuration
data:
  dataset_root: ./datasets/vital_1M

# Trainer configuration
trainer:
  min_steps: 800000
  max_steps: 800000
  val_check_interval:  5000

# Callbacks configuration
callbacks:
  model_checkpoint:
    monitor: val/loss
    mode: min

model:
  num_params: 597  # Vital's parameter count